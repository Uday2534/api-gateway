services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "4001:4001"

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "4002:4002"

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "4003:4003"

  gateway-1:
    build: ./gateway
    container_name: gateway-1
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret

      USER_SERVICE_URL: http://user-service:4001
      ORDER_SERVICE_URL: http://order-service:4002
      PRODUCT_SERVICE_URL: http://product-service:4003

      RATE_LIMIT_CAPACITY: 5
      RATE_LIMIT_REFILL_RATE: 0.1

    expose:
    - "3000"


    depends_on:
      - redis
      - user-service
      - order-service
      - product-service

  gateway-2:
    build: ./gateway
    container_name: gateway-2
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret

      USER_SERVICE_URL: http://user-service:4001
      ORDER_SERVICE_URL: http://order-service:4002
      PRODUCT_SERVICE_URL: http://product-service:4003

      RATE_LIMIT_CAPACITY: 100
      RATE_LIMIT_REFILL_RATE: 10

    expose:
    - "3000"

    depends_on:
      - redis
      - user-service
      - order-service
      - product-service

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./gateway/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - gateway-1
      - gateway-2

    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3001:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway-1
      - gateway-2

volumes:
  grafana-data: